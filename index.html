<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adson</title>
  <meta name="description" content="Adsonのプロフィールとリンク集">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="avatar" aria-hidden="true">A</div>
      <h1>Adson</h1>
      <!-- TODO: ひとこと紹介を書き換える -->
      <p class="tagline">ここにひとこと紹介を書きます。</p>
    </header>

    <section class="card">
      <h2>About</h2>
      <!-- TODO: 自己紹介を書き換える -->
      <p>ここに自己紹介を書きます。住んでいる場所、仕事や学校、最近ハマっていることなど。</p>
    </section>

    <section class="card">
      <h2>好きなこと・やっていること</h2>
      <!-- TODO: 好きなことに書き換える -->
      <ul class="tags">
        <li>好きなこと 1</li>
        <li>好きなこと 2</li>
        <li>好きなこと 3</li>
      </ul>
    </section>

    <section class="card">
      <h2>作ったもの</h2>
      <a class="work" href="todo/">
        <span class="work-title">Todo App</span>
        <span class="work-desc">やることを追加・完了・削除できるシンプルなTodoアプリ</span>
      </a>
    </section>

    <section class="card">
      <h2>Links</h2>
      <!-- TODO: href="#" を自分のURLに書き換える。使わないものは行ごと削除 -->
      <ul class="links">
        <li><a href="#">X（Twitter）</a></li>
        <li><a href="#">Instagram</a></li>
        <li><a href="https://github.com/hosogaiadson">GitHub</a></li>
      </ul>
    </section>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Adson</p>
    </footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
